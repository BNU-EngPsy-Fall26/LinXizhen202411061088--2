<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>飞行训练舱</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111725;color:#eef1fa;font:16px/1.65 system-ui,sans-serif}header,main{max-width:1030px;margin:auto;padding:20px 30px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #394455}nav{display:flex;gap:8px;flex-wrap:wrap}main{padding-top:42px}h1{font-size:clamp(38px,8vw,76px);line-height:1.05;margin:.25em 0}h2{font-size:32px;line-height:1.25}h3{margin-bottom:4px}p{max-width:72ch}small,.muted{color:#bbc7dc}.eyebrow{color:#b5efc3;letter-spacing:.16em;font-weight:700;font-size:13px}.hero{padding:34px 0 42px}.pair,.gauges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.panel{background:#1b2638;border:1px solid #3d4b64;border-radius:14px;padding:22px}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:20px}button,input{font:inherit;border-radius:7px;padding:8px 13px}button{cursor:pointer;border:1px solid #65768d;background:#24344c;color:#f4f7fd}button:hover,button:focus-visible{border-color:#c5f3d2}button.primary{background:#b5efc3;color:#13241b;border-color:#b5efc3;font-weight:700}input:not([type=checkbox]){background:#101827;color:#fff;border:1px solid #7486a0;max-width:100%}svg{width:100%;max-width:235px;display:block;margin:auto}.meter{border:1px solid #45536a;border-radius:12px;background:#1b2638;text-align:center;padding:8px}.meter svg{max-width:137px}.pair .panel{text-align:center}.dialLabel{text-align:center}.status{min-height:1.8em;color:#b5efc3}.scroll{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid #45536a;padding:9px;white-space:nowrap}a{color:#b5efc3}footer{margin-top:35px;color:#bbc7dc}@media(max-width:580px){header,main{padding-inline:15px}.panel{padding:12px}.pair,.gauges{gap:8px}header{align-items:flex-start;gap:8px;flex-direction:column}}
</style>
<header><strong>✦ 飞行训练舱</strong><nav><button id="home">任务大厅</button><button id="design">实验设计</button><button id="results">数据与结果</button></nav></header>
<main id="app"></main>
<script src="flight-data.js"></script><script src="experiment.js"></script></html>
